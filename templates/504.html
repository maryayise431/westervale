{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>504 · Gateway Timeout | WESTERVALE CAPITAL</title>
<link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0A0A0F;--gold:#D4A574;--gold-deep:#895129;--text:#F2F5F9;--muted:#9AA3B2;--cyan:#00D4FF}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%,rgba(137,81,41,.22),transparent 60%),
    radial-gradient(900px 500px at 85% 110%,rgba(0,212,255,.06),transparent 60%),var(--bg);
  background-attachment:fixed;font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);
  padding:2rem 1.25rem;overflow-x:hidden;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(137,81,41,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(137,81,41,.07) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 75%);mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 75%);
}
main{position:relative;z-index:1;width:100%;max-width:640px;text-align:center;animation:rise .7s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.err-icon{
  width:92px;height:92px;margin:0 auto 1.75rem;border-radius:26px;display:flex;align-items:center;justify-content:center;
  font-size:2.6rem;color:#0A0A0F;background:linear-gradient(135deg,#D4A574 0%,#895129 100%);
  box-shadow:0 0 48px rgba(212,165,116,.35),inset 0 1px 0 rgba(255,255,255,.35);
}
.err-code{
  font-family:'Orbitron',sans-serif;font-size:clamp(5rem,18vw,8.5rem);font-weight:900;line-height:1;letter-spacing:-.02em;
  background:linear-gradient(135deg,#F4D8A8 0%,#D4A574 40%,#895129 90%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 30px rgba(212,165,116,.18));
}
h1{font-family:'Orbitron',sans-serif;font-size:1.55rem;font-weight:800;margin:.9rem 0;letter-spacing:.01em}
p{color:var(--muted);font-size:1rem;line-height:1.75;max-width:520px;margin:0 auto}
.err-actions{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center;margin-top:2.25rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;font-weight:600;font-size:.95rem;padding:.8rem 1.5rem;border-radius:12px;border:1px solid transparent;transition:all .25s ease}
.btn-primary{background:linear-gradient(135deg,#D4A574,#895129);color:#0A0A0F;box-shadow:0 10px 28px rgba(137,81,41,.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(137,81,41,.45)}
.btn-outline{border-color:rgba(212,165,116,.4);color:var(--gold);background:rgba(137,81,41,.08)}
.btn-outline:hover{background:rgba(137,81,41,.16);transform:translateY(-2px)}
.err-note{margin-top:2.5rem;font-size:.82rem;color:rgba(154,163,178,.7)}
.err-note a{color:var(--gold);text-decoration:none}
@media (max-width:520px){h1{font-size:1.25rem}.btn{width:100%;justify-content:center}}
</style>
</head>
<body>
<main>
  <div class="err-icon"><i class="ri-timer-line"></i></div>
  <div class="err-code">504</div>
  <h1>Gateway Timeout</h1>
  <p>The server took too long to respond. Please try again in a moment, or check back shortly.</p>
  <div class="err-actions">
    <a href="/" class="btn btn-primary"><i class="ri-home-4-line"></i> Back to Home</a>
    <a href="/investments/" class="btn btn-outline"><i class="ri-pie-chart-2-line"></i> Explore Holdings</a>
  </div>
  <div class="err-note">Need help? <a href="mailto:info@westervalecapital.com">info@westervalecapital.com</a></div>
</main>
</body>
</html>
