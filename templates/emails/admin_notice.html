{% autoescape off %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#0a0a0f; font-family:'Segoe UI', Arial, Helvetica, sans-serif; color:#e8e8ee;">

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0f; padding:32px 16px;">
        <tr>
            <td align="center">

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#12121a; border:1px solid #26262f; border-radius:16px; overflow:hidden;">

                    <!-- Brand header -->
                    <tr>
                        <td style="background:#0d0d14; padding:24px 32px; text-align:center; border-bottom:2px solid #d4af37;">
                            <span style="font-family:Verdana, sans-serif; font-size:24px; font-weight:800; letter-spacing:6px; color:#d4af37;">WESTERVALE</span>
                            <span style="display:block; margin-top:4px; font-size:11px; letter-spacing:3px; color:#8a8a96; text-transform:uppercase;">Capital</span>
                        </td>
                    </tr>

                    <!-- Intro -->
                    <tr>
                        <td style="padding:32px 32px 8px;">
                            <p style="margin:0 0 6px; font-size:13px; color:#8a8a96; text-transform:uppercase; letter-spacing:1px;">Manager notification</p>
                            <h1 style="margin:0 0 12px; font-size:20px; line-height:1.4; color:#ffffff;">{{ subject }}</h1>
                        </td>
                    </tr>

                    <!-- Message body -->
                    <tr>
                        <td style="padding:16px 32px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0d0d14; border:1px solid #26262f; border-radius:12px;">
                                <tr>
                                    <td style="padding:20px; font-size:15px; line-height:1.8; color:#b8b8c4;">
                                        {{ message|linebreaks }}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Action note -->
                    <tr>
                        <td style="padding:8px 32px 24px;">
                            <p style="margin:0; font-size:13px; color:#8a8a96; line-height:1.7;">
                                <span style="color:#d4af37;">&#9888;</span> Log in to the manager panel to review and act on this request.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:20px 32px; background:#0d0d14; border-top:1px solid #1d1d26; text-align:center;">
                            <p style="margin:0; font-size:12px; color:#6d6d7a;">This is an automated notification from the {{ site_name }} management system.</p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
{% endautoescape %}
